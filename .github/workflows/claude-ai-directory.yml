name: Claude.ai Directory

# Builds the plugin tree the Anthropic plugin directory accepts from an
# organization that is not Verified (see tools/claude-directory/) and publishes
# it to the claude-ai-directory branch, which the directory listing tracks.
#
#   pull_request  Build and check only, so a change that would break the
#                 directory build fails in review. OPTIONAL: set the repository
#                 variable CLAUDE_AI_DIRECTORY_PR_CHECK to "false" (Settings >
#                 Secrets and variables > Actions > Variables) to switch it
#                 off without editing this file, or delete the pull_request
#                 trigger below to remove it for good. Releases never depend
#                 on it.
#   v* tag        Build, check, publish.
#   manual run    Same as a tag, from the ref you name (default: main).
#                 Use it for the very first publish, which creates the branch.

on:
  pull_request:
    branches: [main]
    paths:
      - 'skills/**'
      - '.claude-plugin/**'
      - 'LICENSE'
      - 'tools/claude-directory/**'
      - '.github/workflows/claude-ai-directory.yml'
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to publish (must contain tools/claude-directory)'
        required: true
        default: main

# Minimal permissions at workflow level; elevated per-job where required.
permissions:
  contents: read

jobs:

  verify:
    name: Build and check
    # Pull requests run only while the switch is on; tags and manual runs always do.
    if: github.event_name != 'pull_request' || vars.CLAUDE_AI_DIRECTORY_PR_CHECK != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Build
        run: tools/claude-directory/build.sh "$RUNNER_TEMP/claude-ai-directory"
      - name: Check
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          expected=""
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            expected="${REF_NAME#v}"
          fi
          tools/claude-directory/check.sh "$RUNNER_TEMP/claude-ai-directory" ${expected:+"$expected"}

  publish:
    name: Publish to claude-ai-directory
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # One publish at a time; never cancel one that is already pushing.
    concurrency:
      group: claude-ai-directory-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.ref }}
      - name: Build
        run: tools/claude-directory/build.sh "$RUNNER_TEMP/claude-ai-directory"
      - name: Publish
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SOURCE_LABEL: ${{ inputs.ref || github.ref_name }}
        run: |
          expected=""
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            expected="${REF_NAME#v}"
          fi
          EXPECTED_VERSION="$expected" tools/claude-directory/publish.sh "$RUNNER_TEMP/claude-ai-directory"
